<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survivor Gauntlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0A0E1A; --bg-panel:#131A2C; --bg-panel-raised:#1B2438;
    --line:#263252; --ink:#EDF1FA; --muted:#8B96B8;
    --accent:#22D3C4; --accent2:#14B8AA; --accent-ink:#04211D;
    --danger:#FF5A5F; --alive:#34D399; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:radial-gradient(circle at 20% 0%, #16213A 0%, var(--bg) 60%);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  h1,h2,h3,.headline{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.3px;margin:0;}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:16px;border-bottom:2px solid var(--line);margin-bottom:18px;}
  .pool-title{font-size:24px;}
  .pool-sub{color:var(--muted);font-size:13px;margin-top:4px;}
  .week-pill{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;padding:6px 12px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 10px rgba(34,211,196,.35);}
  .btn{font-family:'Inter';font-weight:600;font-size:14px;border:none;border-radius:10px;padding:9px 16px;cursor:pointer;transition:transform .08s ease, box-shadow .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);box-shadow:0 3px 12px rgba(34,211,196,.4);}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:12.5px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  input,select,textarea{background:var(--bg-panel-raised);border:1px solid var(--line);color:var(--ink);padding:9px 10px;border-radius:8px;font-family:'Inter';font-size:14px;width:100%;}
  label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.3);}
  .tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .tab{font-family:'Oswald',sans-serif;font-weight:500;font-size:14px;color:var(--muted);background:none;border:none;padding:10px 4px;margin-right:18px;cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:20px 0;}
  .error-box{background:#3A1A1A;border:1px solid var(--danger);color:#FFD5D0;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;}
  .link{color:var(--accent);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit;font-size:inherit;padding:0;}
  .pool-card{background:var(--bg-panel-raised);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .pool-card .pname{font-weight:700;}
  .pool-card .ptype{font-size:12px;color:var(--muted);margin-top:2px;}
  .standing-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .standing-row:last-child{border-bottom:none;}
  .s-name{font-weight:600;font-size:15px;flex:1;}
  .s-name.dead{color:var(--muted);text-decoration:line-through;}
  .lives{display:flex;gap:4px;}
  .life-dot{width:10px;height:10px;border-radius:50%;background:var(--alive);}
  .life-dot.used{background:var(--danger);opacity:.5;}
  .s-status{font-size:11.5px;color:var(--muted);width:120px;text-align:right;}
  .s-status.alive{color:var(--alive);}
  .s-status.out{color:var(--danger);}
  .team-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:420px){.team-grid{grid-template-columns:1fr;}}
  .team-card{background:var(--bg-panel-raised);border:2px solid var(--line);border-radius:var(--radius);padding:12px;cursor:pointer;text-align:left;font-family:'Inter';transition:border-color .12s ease, box-shadow .12s ease;}
  .team-card.selected{border-color:var(--accent);background:rgba(34,211,196,.12);box-shadow:0 0 0 3px rgba(34,211,196,.25);}
  .team-card.used{opacity:.35;cursor:not-allowed;}
  .team-card .tname{font-weight:700;font-size:15px;}
  .team-card .tmeta{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .pick-locked{background:rgba(52,211,153,.14);border:1px solid var(--alive);border-radius:var(--radius);padding:14px;text-align:center;}
  .pick-locked .tname{font-family:'Oswald';font-size:20px;color:var(--alive);}

  .matchup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:420px){.matchup-grid{grid-template-columns:1fr;}}
  .matchup-card{background:var(--bg-panel-raised);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;align-items:center;gap:8px;}
  .matchup-side{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .matchup-side .mname{font-weight:700;font-size:13.5px;text-align:center;}
  .matchup-side .mpct{font-size:15px;font-weight:700;color:var(--accent);}
  .matchup-vs{font-size:11px;color:var(--muted);font-family:'Oswald';}
  .avatar-choice{font-size:22px;background:var(--bg-panel-raised);border:2px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;}
  .avatar-choice.selected{border-color:var(--accent);background:rgba(34,211,196,.15);}

  .week-strip{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;margin-bottom:4px;}
  .week-strip-item{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:5px;width:56px;}
  .ws-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-size:14px;font-weight:600;border:2px dashed var(--line);color:var(--muted);}
  .ws-label{font-size:10px;color:var(--muted);text-align:center;white-space:nowrap;}
  .week-strip-item.ws-current .ws-circle{border-style:solid;border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,196,.15);}
  .week-strip-item.ws-current .ws-label{color:var(--accent);font-weight:600;}
  .week-strip-item.ws-past .ws-circle{border-style:solid;border-color:var(--alive);color:var(--alive);background:rgba(52,211,153,.08);}

  .mp-card{display:flex;align-items:center;gap:10px;background:var(--bg-panel-raised);border:1px solid var(--line);border-radius:var(--radius);padding:14px 10px;margin-bottom:12px;}
  .mp-side{flex:1;background:none;border:2px solid transparent;border-radius:12px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:'Inter';}
  .mp-side.selected{border-color:var(--accent);background:rgba(34,211,196,.10);}
  .mp-side.used{opacity:.35;cursor:not-allowed;}
  .mp-circle{width:52px;height:52px;border-radius:50%;background:var(--bg-panel);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;font-size:15px;color:var(--ink);overflow:hidden;}
  .mp-name{font-size:12.5px;font-weight:600;text-align:center;line-height:1.25;color:var(--ink);}
  .mp-sub{font-size:10px;color:var(--muted);}
  .mp-pct{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;width:64px;}
  .mp-pct-num{font-family:'Oswald';font-size:16px;font-weight:600;color:var(--ink);}
  .mp-pct-divider{width:1px;height:14px;background:var(--line);margin:1px 0;}
  .mp-pct-caption{font-size:9px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.03em;}
  .picker-list{display:flex;flex-direction:column;gap:3px;margin-top:6px;align-items:center;}
  .picker-row{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);}

  @keyframes floatBlob{0%{transform:translate(0,0) scale(1);}50%{transform:translate(14px,-18px) scale(1.08);}100%{transform:translate(0,0) scale(1);}}
  .auth-bg-blob{position:fixed;top:-90px;right:-70px;width:260px;height:260px;background:radial-gradient(circle,var(--accent) 0%,transparent 70%);opacity:.28;filter:blur(6px);border-radius:50%;animation:floatBlob 9s ease-in-out infinite;pointer-events:none;z-index:0;}
  .auth-bg-blob2{position:fixed;bottom:-110px;left:-70px;width:230px;height:230px;background:radial-gradient(circle,var(--accent2) 0%,transparent 70%);opacity:.22;filter:blur(6px);border-radius:50%;animation:floatBlob 11s ease-in-out infinite reverse;pointer-events:none;z-index:0;}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .auth-card{animation:cardIn .45s cubic-bezier(.2,.8,.2,1);position:relative;z-index:1;}
  .auth-hero-title{font-size:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .input-icon-wrap{position:relative;}
  .input-icon-wrap input{padding-left:38px;}
  .input-icon-wrap .input-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.65;pointer-events:none;}
  .feature-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;font-size:13.5px;color:var(--muted);}
  .feature-row .feature-icon{font-size:15px;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .btn-spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;}
  .chat-list{display:flex;flex-direction:column;gap:10px;max-height:360px;overflow-y:auto;margin-bottom:12px;}
  .chat-msg{background:var(--bg-panel-raised);border-radius:8px;padding:9px 12px;}
  .chat-msg .who-line{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:3px;}
  .chat-input-row{display:flex;gap:8px;}
  .chat-input-row textarea{min-height:40px;resize:none;}
  .section-label{font-family:'Oswald';font-size:14px;color:var(--muted);margin:16px 0 8px;}
  .section-label:first-child{margin-top:0;}
  details.panel{padding:0;overflow:hidden;}
  details.panel summary{list-style:none;cursor:pointer;padding:16px;font-family:'Oswald';font-size:14px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;}
  details.panel summary::-webkit-details-marker{display:none;}
  details.panel summary::after{content:'+';color:var(--muted);font-size:20px;font-weight:400;}
  details.panel[open] summary::after{content:'–';}
  details.panel summary .summary-sub{font-family:'Inter';font-weight:400;font-size:12px;color:var(--muted);margin-top:2px;}
  details.panel .details-body{padding:0 16px 16px;}
  .team-edit-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .divider{height:1px;background:var(--line);margin:16px 0;}
  .result-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);}
  .result-row:last-child{border-bottom:none;}
  .result-row .rname{flex:1;font-weight:600;font-size:14px;}
  .toggle-group{display:flex;gap:6px;}
  .toggle-btn{font-family:'Inter';font-weight:600;font-size:12px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;}
  .toggle-btn.win.active{background:var(--alive);border-color:var(--alive);color:#fff;}
  .toggle-btn.loss.active{background:var(--danger);border-color:var(--danger);color:#fff;}
  .invite-code{font-family:'Oswald';font-size:22px;letter-spacing:2px;background:var(--bg-panel-raised);border:1px dashed var(--accent);border-radius:8px;padding:10px;text-align:center;margin:8px 0;}
  .helper{color:var(--muted);font-size:12.5px;margin-top:4px;}
  .toplinks{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
</style>
</head>
<body>
<div class="wrap" id="app">Loading…</div>

<script>
const SUPABASE_URL = 'https://zsyxkemlxzrtetjmgtjf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_01rP32fYxLauevlz1D9uiQ_fedS-KUP';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let session = null;
let profile = null;
let myPools = [];
let activePool = null;
let activeTab = 'standings';
let commishTab = 'matchups';
let selectedTeamDraft = null;
let pendingResults = {};
let scoreWeekSelection = null;
let pendingTeamLogos = {};
let authMode = 'login';
let showLanding = true;
let errorMsg = '';
let loading = false;

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function el(id){ return document.getElementById(id); }
function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out=''; for(let i=0;i<6;i++) out+=chars[Math.floor(Math.random()*chars.length)];
  return out;
}

// ---------- data helpers ----------
async function loadProfile(){
  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  profile = data || null;
}

async function loadMyPools(){
  const { data, error } = await sb.from('pool_members').select('pool_id, pools(*)').eq('user_id', session.user.id);
  myPools = (data||[]).map(r=>r.pools).filter(Boolean);
}

async function loadPoolFull(poolId){
  const [{data: pool}, {data: memberRows}, {data: matchups}, {data: picks}, {data: results}, {data: chat}, {data: teams}] = await Promise.all([
    sb.from('pools').select('*').eq('id', poolId).maybeSingle(),
    sb.from('pool_members').select('user_id').eq('pool_id', poolId),
    sb.from('matchups').select('*').eq('pool_id', poolId),
    sb.from('picks').select('*').eq('pool_id', poolId),
    sb.from('results').select('*').eq('pool_id', poolId),
    sb.from('chat_messages').select('*').eq('pool_id', poolId).order('created_at', {ascending:true}),
    sb.from('teams').select('*').eq('pool_id', poolId)
  ]);
  const userIds = [...new Set((memberRows||[]).map(r=>r.user_id))];
  let profilesById = {};
  if(userIds.length){
    const { data: profiles } = await sb.from('profiles').select('id, display_name, avatar').in('id', userIds);
    (profiles||[]).forEach(p=>{ profilesById[p.id] = p; });
  }
  const members = (memberRows||[]).map(r=>({ user_id: r.user_id, profiles: profilesById[r.user_id] || { display_name:'Unknown', avatar:null } }));
  activePool = {
    pool, members, matchups: matchups||[], picks: picks||[], results: results||[], chat: chat||[], teams: teams||[]
  };
}

function teamInfo(name){
  return (activePool.teams||[]).find(t=>t.name===name) || { name, logo_url:null, owner_label:null };
}

function weekMatchups(week){
  return (activePool.matchups||[]).filter(m=>m.week===week);
}
function allTeamsUsed(){
  return [...new Set((activePool.matchups||[]).flatMap(m=>[m.team_a, m.team_b]))].sort();
}

function weekTeams(week){
  const set = new Set();
  weekMatchups(week).forEach(m=>{ set.add(m.team_a); set.add(m.team_b); });
  return [...set];
}
function opponentOf(team, week){
  const m = weekMatchups(week).find(m=>m.team_a===team || m.team_b===team);
  if(!m) return null;
  return m.team_a===team ? m.team_b : m.team_a;
}
function winPctFor(team, week){
  const m = weekMatchups(week).find(m=>m.team_a===team || m.team_b===team);
  if(!m || m.home_win_pct==null) return null;
  return m.team_a===team ? Math.round(m.home_win_pct) : Math.round(100-m.home_win_pct);
}
function americanOddsToProb(price){
  return price < 0 ? (-price)/((-price)+100) : 100/(price+100);
}
function parseMatchupLine(line){
  let pct = null;
  let rest = line;
  const pipeIdx = line.lastIndexOf('|');
  if(pipeIdx !== -1){
    const maybePct = line.slice(pipeIdx+1).trim();
    if(/^\d{1,3}$/.test(maybePct)){
      pct = Math.min(99, Math.max(1, Number(maybePct)));
      rest = line.slice(0, pipeIdx).trim();
    }
  }
  const parts = rest.split(/\s+vs\s+/i);
  if(parts.length!==2) return null;
  return { team_a: parts[0].trim(), team_b: parts[1].trim(), home_win_pct: pct };
}
function weekKickoff(week){
  const ms = weekMatchups(week).map(m=>m.kickoff_time).filter(Boolean);
  if(!ms.length) return null;
  return ms.sort()[0];
}
function pickWindowClosed(week){
  const t = weekKickoff(week);
  if(!t) return false;
  return Date.now() >= new Date(t).getTime();
}
function formatKickoff(week){
  const t = weekKickoff(week);
  if(!t) return null;
  return new Date(t).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}
function resultFor(week, team){
  const r = (activePool.results||[]).find(r=>r.week===week && r.team===team);
  return r ? r.outcome : null;
}
function picksForUser(userId){
  return (activePool.picks||[]).filter(p=>p.user_id===userId).sort((a,b)=>a.week-b.week);
}
function computeActiveWeek(){
  const weeksWithMatchups = [...new Set((activePool.matchups||[]).map(m=>m.week))].sort((a,b)=>a-b);
  if(!weeksWithMatchups.length) return activePool.pool.current_week;
  for(const w of weeksWithMatchups){
    if(!pickWindowClosed(w)) return w;
  }
  return weeksWithMatchups[weeksWithMatchups.length-1];
}

function teamUseCounts(userId){
  const counts = {};
  const cw = computeActiveWeek();
  picksForUser(userId).forEach(p=>{
    const countsNow = p.week < cw || (p.week === cw && pickWindowClosed(cw));
    if(countsNow) counts[p.team] = (counts[p.team]||0) + 1;
  });
  return counts;
}
function maxTeamUses(){
  const m = activePool.pool.max_team_uses;
  return (m===null || m===undefined || m<=0) ? Infinity : m;
}
function isTeamMaxedOut(userId, team){
  const counts = teamUseCounts(userId);
  return (counts[team]||0) >= maxTeamUses();
}
function statusFor(userId){
  const cw = computeActiveWeek();
  const lives = activePool.pool.lives_allowed;
  const picks = picksForUser(userId).filter(p=>p.week <= cw);
  let misses = 0, eliminatedWeek = null;
  for(const p of picks){
    const outcome = resultFor(p.week, p.team);
    if(outcome==='loss'){
      misses++;
      if(misses===lives && eliminatedWeek===null) eliminatedWeek = p.week;
    }
  }
  return { picks, misses, eliminated: misses>=lives, eliminatedWeek };
}
function seasonOver(){
  const cw = computeActiveWeek();
  return cw >= activePool.pool.total_weeks && pickWindowClosed(activePool.pool.total_weeks);
}
function aliveMembers(){ return activePool.members.filter(m=>!statusFor(m.user_id).eliminated); }

// ---------- render ----------
async function render(){
  const app = el('app');
  if(!session){
    if(showLanding){ app.innerHTML = renderLanding(); bindLandingEvents(); return; }
    app.innerHTML = renderAuth(); bindAuthEvents(); return;
  }
  if(!profile){ app.innerHTML = renderSetName(); bindSetNameEvents(); return; }
  if(!activePool){ app.innerHTML = renderDashboard(); bindDashboardEvents(); return; }
  app.innerHTML = renderPoolShell();
  bindPoolEvents();
}

function renderLanding(){
  return `
    <div class="auth-bg-blob"></div>
    <div class="auth-bg-blob2"></div>
    <div class="panel auth-card" style="margin-top:40px;">
      <h1 class="auth-hero-title" style="margin-bottom:6px;">Survivor Gauntlet</h1>
      <div class="pool-sub" style="margin-bottom:18px;">Fantasy Survivor Gauntlet &amp; NFL Survivor pools</div>
      <div style="font-size:14px;line-height:1.6;color:var(--ink);margin-bottom:18px;">
        Pick a team each week — your fantasy league's matchups or real NFL games — and try to survive the season without picking a loser twice.
      </div>
      <div style="margin-bottom:20px;">
        <div class="feature-row"><span class="feature-icon">⏱️</span><span>Picks stay editable until Thursday kickoff</span></div>
        <div class="feature-row"><span class="feature-icon">📊</span><span>Standings, lives, and pick history for the whole group</span></div>
        <div class="feature-row"><span class="feature-icon">💬</span><span>Live trash talk chat</span></div>
        <div class="feature-row"><span class="feature-icon">🔁</span><span>Each team can only be used once all season</span></div>
      </div>
      <button class="btn btn-accent" id="landing-signup" style="width:100%;margin-bottom:10px;">Create an account</button>
      <button class="btn btn-ghost" id="landing-login" style="width:100%;">I already have an account</button>
    </div>`;
}

function bindLandingEvents(){
  el('landing-signup').onclick = ()=>{ authMode='signup'; showLanding=false; errorMsg=''; render(); };
  el('landing-login').onclick = ()=>{ authMode='login'; showLanding=false; errorMsg=''; render(); };
}

function renderAuth(){

function resizeImageFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const size = 128;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const minSide = Math.min(img.width, img.height);
        const sx = (img.width-minSide)/2, sy = (img.height-minSide)/2;
        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
        canvas.toBlob(blob=>resolve(blob), 'image/jpeg', 0.82);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadAvatarImage(file){
  const blob = await resizeImageFile(file);
  const path = `${session.user.id}/avatar.jpg`;
  const { error } = await sb.storage.from('avatars').upload(path, blob, { upsert:true, contentType:'image/jpeg' });
  if(error) throw error;
  const { data } = sb.storage.from('avatars').getPublicUrl(path);
  return data.publicUrl + '?t=' + Date.now();
}

function relativeCountdown(isoTime){
  const diff = new Date(isoTime).getTime() - Date.now();
  if(diff<=0) return null;
  const days = Math.floor(diff/86400000);
  const hours = Math.floor((diff%86400000)/3600000);
  if(days>0) return `${days}d ${hours}h left`;
  const mins = Math.floor((diff%3600000)/60000);
  return `${hours}h ${mins}m left`;
}
function weekUsedFor(userId, team){

  return hit ? hit.week : null;

function renderWeekStrip(cw){
  const total = activePool.pool.total_weeks;
  const items = [];
  for(let w=1; w<=total; w++){
    const hasMatchups = weekMatchups(w).length>0;
    const isCurrent = w===cw;
    const isPast = w<cw;
    let stateClass = isCurrent ? 'ws-current' : (isPast ? 'ws-past' : 'ws-future');
    items.push(`<div class="week-strip-item ${stateClass}">
      <div class="ws-circle">${isPast?'✓':w}</div>
      <div class="ws-label">${isCurrent?'Current':'Wk '+w}</div>
    </div>`);
  }
  return `<div class="week-strip">${items.join('')}</div>`;
}

  if(closedWeeks.length) return closedWeeks[closedWeeks.length-1];

function bindAuthEvents(){
  el('switch-mode').onclick = ()=>{ authMode = authMode==='login'?'signup':'login'; errorMsg=''; render(); };
  el('back-to-landing').onclick = ()=>{ showLanding=true; errorMsg=''; render(); };
  el('auth-submit').onclick = async ()=>{
    const email = el('auth-email').value.trim();
    const pass = el('auth-pass').value;
    if(!email || !pass){ errorMsg='Enter an email and password.'; render(); return; }
    loading = true; errorMsg=''; render();
    try{
      if(authMode==='login'){
        const { error } = await sb.auth.signInWithPassword({ email, password: pass });
        if(error) throw error;
      } else {
        const { data, error } = await sb.auth.signUp({ email, password: pass });
        if(error) throw error;
        const { data: { session: s0 } } = await sb.auth.getSession();
        if(!s0 && data.user){
          errorMsg = "Account created — check your email for a confirmation link, then come back and log in.";
          loading = false; render(); return;
        }
      }
      const { data: { session: s } } = await sb.auth.getSession();
      session = s;
      if(session){ await loadProfile(); if(profile) await loadMyPools(); }
    }catch(e){
      errorMsg = e.message || 'Something went wrong.';
    }
    loading = false; render();
  };
}

let chatChannel = null;
function subscribeChat(){
  if(chatChannel) sb.removeChannel(chatChannel);
  const poolId = activePool.pool.id;
  chatChannel = sb.channel('pool-'+poolId)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'chat_messages', filter:`pool_id=eq.${poolId}` }, payload=>{
      activePool.chat.push(payload.new);
      if(activeTab==='chat') render();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'picks', filter:`pool_id=eq.${poolId}` }, async ()=>{
      await loadPoolFull(poolId); render();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'results', filter:`pool_id=eq.${poolId}` }, async ()=>{
      await loadPoolFull(poolId); render();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'matchups', filter:`pool_id=eq.${poolId}` }, async ()=>{
      await loadPoolFull(poolId); render();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'pool_members', filter:`pool_id=eq.${poolId}` }, async ()=>{
      await loadPoolFull(poolId); render();
    })
    .subscribe();
}

async function renameTeamCascade(poolId, oldName, newName, ownerLabel, logoUrl){
  if(newName !== oldName){
    const results = await Promise.all([
      sb.from('matchups').update({ team_a: newName }).eq('pool_id', poolId).eq('team_a', oldName),
      sb.from('matchups').update({ team_b: newName }).eq('pool_id', poolId).eq('team_b', oldName),
      sb.from('picks').update({ team: newName }).eq('pool_id', poolId).eq('team', oldName),
      sb.from('results').update({ team: newName }).eq('pool_id', poolId).eq('team', oldName)
    ]);
    const failed = results.find(r=>r.error);
    if(failed) throw failed.error;
  }
  const { error: teamErr } = await sb.from('teams').upsert(
    { pool_id: poolId, name: newName, owner_label: ownerLabel || null, logo_url: logoUrl },
    { onConflict: 'pool_id,name' }
  );
  if(teamErr) throw teamErr;
}

function bindPoolEvents(){
  const dismissErrorBtn = el('dismiss-error-btn');
  if(dismissErrorBtn) dismissErrorBtn.onclick = ()=>{ errorMsg=''; render(); };
  el('back-to-dashboard').onclick = ()=>{ if(chatChannel){ sb.removeChannel(chatChannel); chatChannel=null; } activePool=null; render(); };
  const refreshBtn = el('refresh-pool-btn');
  if(refreshBtn) refreshBtn.onclick = async ()=>{
    loading = true; render();
    await loadPoolFull(activePool.pool.id);
    loading = false; render();
  };
  el('logout-btn').onclick = async ()=>{ if(chatChannel) sb.removeChannel(chatChannel); await sb.auth.signOut(); session=null; profile=null; activePool=null; render(); };
  document.querySelectorAll('.tab').forEach(t=>{ t.onclick = ()=>{ activeTab=t.dataset.tab; selectedTeamDraft=null; pendingResults={}; scoreWeekSelection=null; render(); }; });

  document.querySelectorAll('.mp-side:not(.used)').forEach(c=>{
    c.onclick = ()=>{ selectedTeamDraft = c.dataset.team; render(); };
  });
  const saveBtn = el('save-pick-btn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const cw = activePool.pool.current_week;
    const existing = (activePool.picks||[]).find(p=>p.user_id===session.user.id && p.week===cw);
    const team = selectedTeamDraft || (existing && existing.team);
    if(!team) return;
    loading = true; render();
    try{
      const { error } = await sb.from('picks').upsert({ pool_id: activePool.pool.id, user_id: session.user.id, week: cw, team }, { onConflict:'pool_id,user_id,week' });
      if(error) throw error;
      selectedTeamDraft = null;
      await loadPoolFull(activePool.pool.id);
    }catch(e){ errorMsg = e.message; }
    loading = false; render();
  };

  const sendChatBtn = el('send-chat-btn');
  if(sendChatBtn) sendChatBtn.onclick = async ()=>{
    const text = el('chat-text').value.trim();
    if(!text) return;
    loading = true; render();
    try{
      const { error } = await sb.from('chat_messages').insert({ pool_id: activePool.pool.id, user_id: session.user.id, display_name: profile.display_name, message: text });
      if(error) throw error;
      await loadPoolFull(activePool.pool.id);
    }catch(e){ errorMsg = e.message; }
    loading = false; render();
  };

  const importBulkBtn = el('import-bulk-btn');
  if(importBulkBtn) importBulkBtn.onclick = async ()=>{
    const raw = el('bulk-schedule').value;
    const lines = raw.split('\n').map(l=>l.trim());
    const weekHeaderRe = /^week\s+(\d+)\s*\|\s*(.+)$/i;
    const rows = [];
    let curWeek = null, curKickoffISO = null;
    let badLines = [];
    for(const line of lines){
      if(!line) continue;
      const hm = line.match(weekHeaderRe);
      if(hm){
        curWeek = Number(hm[1]);
        const d = new Date(hm[2].trim());
        if(isNaN(d.getTime())){ badLines.push(line); curWeek = null; continue; }
        curKickoffISO = d.toISOString();
        continue;
      }
      if(curWeek===null) continue;
      const parsed = parseMatchupLine(line);
      if(!parsed){ badLines.push(line); continue; }
      rows.push({ pool_id: activePool.pool.id, week: curWeek, team_a: parsed.team_a, team_b: parsed.team_b, kickoff_time: curKickoffISO, home_win_pct: parsed.home_win_pct });
    }
    if(!rows.length){ errorMsg='Nothing parsed — check the format matches the example.'; render(); return; }
    const existingWeeks = new Set((activePool.matchups||[]).map(m=>m.week));
    const toInsert = rows.filter(r=>!existingWeeks.has(r.week));
    const skippedWeeks = [...new Set(rows.filter(r=>existingWeeks.has(r.week)).map(r=>r.week))];
    loading = true; errorMsg=''; render();
    try{
      if(toInsert.length){
        const { error } = await sb.from('matchups').insert(toInsert);
        if(error) throw error;
      }
      await loadPoolFull(activePool.pool.id);
      if(badLines.length) errorMsg = `Imported, but couldn't read these lines: ${badLines.join(' | ')}`;
      else if(skippedWeeks.length) errorMsg = `Imported. Skipped weeks that already had matchups: ${skippedWeeks.join(', ')}.`;
    }catch(e){ errorMsg = e.message; }
    loading = false; render();
  };

  const addMatchupsBtn = el('add-matchups-btn');
  if(addMatchupsBtn) addMatchupsBtn.onclick = async ()=>{
    const lines = el('matchup-lines').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const kickoffLocal = el('matchup-kickoff').value;
    if(!lines.length || !kickoffLocal){ errorMsg='Add at least one matchup and a kickoff time.'; render(); return; }
    const kickoffISO = new Date(kickoffLocal).toISOString();
    const rows = [];
    for(const line of lines){
      const parsed = parseMatchupLine(line);
      if(!parsed) continue;
      rows.push({ pool_id: activePool.pool.id, week: computeActiveWeek(), team_a: parsed.team_a, team_b: parsed.team_b, kickoff_time: kickoffISO, home_win_pct: parsed.home_win_pct });
    }
    if(!rows.length){ errorMsg='Use the format "TeamA vs TeamB", one per line.'; render(); return; }
    loading = true; errorMsg=''; render();
    try{
      const { error } = await sb.from('matchups').insert(rows);
      if(error) throw error;
      await loadPoolFull(activePool.pool.id);
    }catch(e){ errorMsg = e.message; }
    loading = false; render();
  };

  document.querySelectorAll('[data-rteam]').forEach(btn=>{
    btn.onclick = ()=>{ pendingResults[btn.dataset.rteam] = btn.dataset.rval; render(); };
  });

  document.querySelectorAll('[data-logo-team]').forEach(inp=>{
    inp.onchange = async ()=>{
      const file = inp.files[0];
      if(!file) return;
      const team = inp.dataset.logoTeam;
      loading = true; errorMsg=''; render();
      try{
        pendingTeamLogos[team] = await uploadAvatarImage(file);
      }catch(e){ errorMsg = e.message; }
      loading = false; render();
    };
  });

  document.querySelectorAll('[data-rename-btn]').forEach(btn=>{
    btn.onclick = async ()=>{
      const oldName = btn.dataset.renameBtn;
      const nameInput = document.querySelector(`[data-rename-old="${CSS.escape(oldName)}"]`);
      const ownerInput = document.querySelector(`[data-owner-team="${CSS.escape(oldName)}"]`);
      const newName = nameInput.value.trim();
      const ownerLabel = ownerInput ? ownerInput.value.trim() : '';
      const logoUrl = pendingTeamLogos[oldName] || teamInfo(oldName).logo_url || null;
      if(!newName) return;
      loading = true; errorMsg=''; render();
      try{
        await renameTeamCascade(activePool.pool.id, oldName, newName, ownerLabel, logoUrl);
        delete pendingTeamLogos[oldName];
        await loadPoolFull(activePool.pool.id);
      }catch(e){ errorMsg = e.message; }
      loading = false; render();
    };
  });

  const bulkRenameBtn = el('bulk-rename-btn');
  if(bulkRenameBtn) bulkRenameBtn.onclick = async ()=>{
    const lines = el('bulk-rename-input').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const pairs = [];
    const badLines = [];
    lines.forEach(line=>{
      const m = line.split(/\s*->\s*/);
      if(m.length!==2 || !m[0] || !m[1]){ badLines.push(line); return; }
      pairs.push({ oldName: m[0].trim(), newName: m[1].trim() });
    });
    if(!pairs.length){ errorMsg='Use the format "OldName -> NewName", one per line.'; render(); return; }
    loading = true; errorMsg=''; render();
    try{
      const poolId = activePool.pool.id;
      for(const {oldName, newName} of pairs){
        const info = teamInfo(oldName);
        await renameTeamCascade(poolId, oldName, newName, info.owner_label, info.logo_url);
      }
      await loadPoolFull(poolId);
      errorMsg = `Renamed ${pairs.length} team(s).` + (badLines.length ? ` Skipped unreadable lines: ${badLines.join(', ')}.` : '');
    }catch(e){ errorMsg = e.message; }
    loading = false; render();
  };

  const overrideWeekInput = el('override-week');
  if(overrideWeekInput) overrideWeekInput.oninput = ()=>{
    const w = Number(overrideWeekInput.value)||activePool.pool.current_week;
    const teams = weekTeams(w);
    const sel = el('override-team');
    sel.innerHTML = (teams.length?teams:['— no matchups for this week yet —']).map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  };
  const overridePickBtn = el('override-pick-btn');
  if(overridePickBtn) overridePickBtn.onclick = async ()=>{
    const userId = el('override-member').value;
    const week = Number(el('override-week').value);
    const team = el('override-team').value;
    if(!userId || !week || !team){ errorMsg='Pick a member, week, and team.'; render(); return; }
    loading = true; errorMsg=''; render();
    try{
      const { error } = await sb.from('picks').upsert({ pool_id: activePool.pool.id, user_id: userId, week, team }, { onConflict:'pool_id,user_id,week' });
      if(error) throw error;
      await loadPoolFull(activePool.pool.id);
    }catch(e){ errorMsg = e.message; }
    loading = false; render();
  };

  document.querySelectorAll('[data-odds-a]').forEach(inpA=>{
    const inpB = document.querySelector(`[data-odds-b="${inpA.dataset.oddsA}"]`);
    if(!inpB) return;
    inpA.oninput = ()=>{ const v = Number(inpA.value); if(v>=1 && v<=99) inpB.value = 100-v; };
    inpB.oninput = ()=>{ const v = Number(inpB.value); if(v>=1 && v<=99) inpA.value = 100-v; };
  });
  const bulkOddsBtn = el('bulk-odds-btn');
  if(bulkOddsBtn) bulkOddsBtn.onclick = async ()=>{
    const raw = el('bulk-odds').value;
    const lines = raw.split('\n').map(l=>l.trim());
    const weekHeaderRe = /^week\s+(\d+)\s*$/i;
    let curWeek = null;
    const byWeek = {};
    for(const line of lines){
      if(!line) continue;
      const hm = line.match(weekHeaderRe);
      if(hm){ curWeek = Number(hm[1]); byWeek[curWeek] = byWeek[curWeek] || {}; continue; }
      if(curWeek===null) continue;
      const m = line.match(/^(.+?)\s+(\d{1,3})$/);
      if(!m) continue;
      byWeek[curWeek][m[1].trim()] = Number(m[2]);
    }
    loading = true; errorMsg=''; render();
    try{
      const updates = [];
      let matched = 0, unmatched = [];
      Object.keys(byWeek).forEach(week=>{
        const teamPcts = byWeek[week];
        const weekNum = Number(week);
        weekMatchups(weekNum).forEach(m=>{
          let pct = null;
          if(teamPcts[m.team_a]!==undefined) pct = teamPcts[m.team_a];
          else if(teamPcts[m.team_b]!==undefined) pct = 100 - teamPcts[m.team_b];
          if(pct==null){ unmatched.push(`Week ${week}: ${m.team_a} vs ${m.team_b}`); return; }
          matched++;
          updates.push(sb.from('matchups').update({ home_win_pct: Math.min(99,Math.max(1,pct)) }).eq('id', m.id));
        });
      });
      const results = await Promise.all(updates);
      const failed = results.find(r=>r.error);
      if(failed) throw failed.error;
      await loadPoolFull(activePool.pool.id);
      errorMsg = `Updated ${matched} matchup(s).` + (unmatched.length ? ` No data for: ${unmatched.join(', ')}.` : '');
    }catch(e){ errorMsg = e.message; }
    loading = false; render();
  };

  document.querySelectorAll('[data-fix-save]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.fixSave;
      const teamAInput = document.querySelector(`[data-fix-team-a="${id}"]`);
      const teamBInput = document.querySelector(`[data-fix-team-b="${id}"]`);
      const kickoffInput = document.querySelector(`[data-fix-kickoff="${id}"]`);
      const newA = teamAInput.value.trim();
      const newB = teamBInput.value.trim();
      const newKickoff = kickoffInput.value ? new Date(kickoffInput.value).toISOString() : null;
      if(!newA || !newB) return;
      loading = true; errorMsg=''; render();
      try{
        const { error } = await sb.from('matchups').update({ team_a: newA, team_b: newB, kickoff_time: newKickoff }).eq('id', id);
        if(error) throw error;
        await loadPoolFull(activePool.pool.id);
      }catch(e){ errorMsg = e.message; }
      loading = false; render();
    };
  });

  const saveOddsBtn = el('save-odds-btn');
  if(saveOddsBtn) saveOddsBtn.onclick = async ()=>{
    const inputs = document.querySelectorAll('[data-odds-a]');
    loading = true; errorMsg=''; render();
    try{
      const updates = [];
      inputs.forEach(inp=>{
        const val = inp.value.trim();
        if(val==='') return;
        const pct = Math.min(99, Math.max(1, Number(val)));
        updates.push(sb.from('matchups').update({ home_win_pct: pct }).eq('id', inp.dataset.oddsA));
      });
      const results = await Promise.all(updates);
      const failed = results.find(r=>r.error);
      if(failed) throw failed.error;
      await loadPoolFull(activePool.pool.id);
    }catch(e){ errorMsg = e.message; }
    loading = false; render();
  };

  const scoreWeekInput = el('score-week-input');
  if(scoreWeekInput) scoreWeekInput.onchange = ()=>{
    scoreWeekSelection = Number(scoreWeekInput.value)||scoreWeekSelection;
    pendingResults = {};
    render();
  };

  const saveResultsBtn = el('save-results-btn');
  if(saveResultsBtn) saveResultsBtn.onclick = async ()=>{
    const week = scoreWeekSelection || defaultScoreWeek();
    const teams = weekTeams(week);
    const missing = teams.filter(t=> pendingResults[t]===undefined && resultFor(week,t)===null);
    if(missing.length && !confirm(`No result set for: ${missing.join(', ')}. Continue anyway?`)) return;
    loading = true; errorMsg=''; render();
    try{
      const rows = Object.keys(pendingResults).map(team=>({ pool_id: activePool.pool.id, week, team, outcome: pendingResults[team] }));
      if(rows.length){
        const { error } = await sb.from('results').upsert(rows, { onConflict:'pool_id,week,team' });
        if(error) throw error;
      }
      pendingResults = {};
      await loadPoolFull(activePool.pool.id);
    }catch(e){ errorMsg = e.message; }
    loading = false; render();
  };

  const saveSettingsBtn = el('save-settings-btn');
  if(saveSettingsBtn) saveSettingsBtn.onclick = async ()=>{
    const lives = Number(el('settings-lives').value)||activePool.pool.lives_allowed;
    const weeks = Number(el('settings-weeks').value)||activePool.pool.total_weeks;
    const maxUses = Number(el('settings-max-uses').value);
    const oddsKeyInput = el('settings-odds-key');
    const update = { lives_allowed: lives, total_weeks: weeks, max_team_uses: isNaN(maxUses)?1:maxUses };
    if(oddsKeyInput) update.odds_api_key = oddsKeyInput.value.trim();
    loading = true; render();
    try{
      const { error } = await sb.from('pools').update(update).eq('id', activePool.pool.id);
      if(error) throw error;
      await loadPoolFull(activePool.pool.id);
    }catch(e){ errorMsg = e.message; }
    loading = false; render();
  };

  const fetchOddsBtn = el('fetch-odds-btn');
  if(fetchOddsBtn) fetchOddsBtn.onclick = async ()=>{
    const key = activePool.pool.odds_api_key;
    if(!key){ errorMsg='Add your Odds API key in Settings first.'; render(); return; }
    loading = true; errorMsg=''; render();
    try{
      const week = computeActiveWeek();
      const matchupsThisWeek = weekMatchups(week);
      const resp = await fetch(`https://api.the-odds-api.com/v4/sports/americanfootball_nfl/odds/?apiKey=${encodeURIComponent(key)}&regions=us&markets=h2h&oddsFormat=american`);
      if(!resp.ok) throw new Error('Odds API request failed ('+resp.status+'). Check your API key.');
      const games = await resp.json();
      let matched = 0, unmatched = [];
      for(const m of matchupsThisWeek){
        const game = games.find(g=>{
          const home = (g.home_team||'').toLowerCase();
          const away = (g.away_team||'').toLowerCase();
          const a = m.team_a.toLowerCase(), b = m.team_b.toLowerCase();
          return (home.includes(a) || a.includes(home) || home.includes(b) || b.includes(home)) &&
                 (away.includes(a) || a.includes(away) || away.includes(b) || b.includes(away));
        });
        if(!game || !game.bookmakers || !game.bookmakers.length){ unmatched.push(m.team_a+' vs '+m.team_b); continue; }
        const market = game.bookmakers[0].markets.find(mk=>mk.key==='h2h');
        if(!market){ unmatched.push(m.team_a+' vs '+m.team_b); continue; }
        const homeOutcome = market.outcomes.find(o=>o.name===game.home_team);
        const awayOutcome = market.outcomes.find(o=>o.name===game.away_team);
        if(!homeOutcome || !awayOutcome){ unmatched.push(m.team_a+' vs '+m.team_b); continue; }
        const homeProb = americanOddsToProb(homeOutcome.price);
        const awayProb = americanOddsToProb(awayOutcome.price);
        const normHome = homeProb/(homeProb+awayProb);
        const teamAisHome = game.home_team.toLowerCase().includes(m.team_a.toLowerCase()) || m.team_a.toLowerCase().includes(game.home_team.toLowerCase());
        const homeWinPct = Math.round((teamAisHome ? normHome : 1-normHome) * 100);
        const { error } = await sb.from('matchups').update({ home_win_pct: homeWinPct }).eq('id', m.id);
        if(!error) matched++;
      }
      await loadPoolFull(activePool.pool.id);
      errorMsg = `Matched odds for ${matched} game(s).` + (unmatched.length ? ` Couldn't match: ${unmatched.join(', ')} — check team names match real NFL team names.` : '');
    }catch(e){ errorMsg = e.message; }
    loading = false; render();
  };

  const deletePoolBtn = el('delete-pool-btn');
  if(deletePoolBtn) deletePoolBtn.onclick = async ()=>{
    if(!confirm(`Permanently delete "${activePool.pool.name}"? This wipes everyone's picks, matchups, and chat. Cannot be undone.`)) return;
    loading = true; errorMsg=''; render();
    try{
      const { error } = await sb.from('pools').delete().eq('id', activePool.pool.id);
      if(error) throw error;
      if(chatChannel){ sb.removeChannel(chatChannel); chatChannel=null; }
      activePool = null;
      await loadMyPools();
    }catch(e){ errorMsg = e.message; }
    loading = false; render();
  };
}

// ---------- boot ----------
async function boot(){
  const { data: { session: s } } = await sb.auth.getSession();
  session = s;
  if(session){
    await loadProfile();
    if(profile) await loadMyPools();
  }
  render();
}
sb.auth.onAuthStateChange((event, s)=>{ session = s; });
boot();
</script>
</body>
</html>
